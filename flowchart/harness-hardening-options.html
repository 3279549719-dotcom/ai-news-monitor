<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness 加固 · 采纳决策工具</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:#141926;
    --panel2:#0e1320;
    --border:#232b3d;
    --border2:#2f3a52;
    --text:#e8ecf4;
    --muted:#93a0b4;
    --muted2:#67718a;
    --accent:#5b8cff;
    --accent-soft:rgba(91,140,255,.14);
    --green:#3ddc84;
    --green-soft:rgba(61,220,132,.12);
    --amber:#f5b45c;
    --amber-soft:rgba(245,180,92,.12);
    --danger:#ff6b6b;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Consolas,"Cascadia Mono","Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}

  /* ---------- header ---------- */
  header{max-width:1120px;margin:0 auto;padding:36px 20px 6px}
  h1{font-size:22px;font-weight:700;margin:0 0 8px;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0;max-width:68ch}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .preset{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:999px;
    padding:7px 16px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:all .15s}
  .preset:hover{border-color:var(--border2)}
  .preset.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .preset .tag{font-size:11px;opacity:.75;margin-left:2px}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;max-width:1120px;margin:0 auto;padding:22px 20px 30px;align-items:start}
  @media(max-width:920px){main{grid-template-columns:1fr}}
  .groups{display:flex;flex-direction:column;gap:26px;min-width:0}

  /* ---------- groups & cards ---------- */
  .group-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
  .group-title h2{font-size:16px;margin:0;font-weight:650}
  .group-title .gdesc{font-size:12px;color:var(--muted)}
  .cards{display:flex;flex-direction:column;gap:10px}

  .card{display:flex;gap:13px;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;transition:opacity .15s,border-color .15s}
  .card.off{opacity:.5}
  .card:not(.off){border-color:var(--border2)}
  .card-body{flex:1;min-width:0}

  .card-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .card-head h3{margin:0;font-size:15px;font-weight:600}
  .id{font-family:var(--mono);font-size:12px;color:var(--accent);margin-right:4px}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;font-weight:500}
  .rec-recommend{color:var(--green);background:var(--green-soft);border-color:rgba(61,220,132,.4)}
  .rec-optional{color:var(--amber);background:var(--amber-soft);border-color:rgba(245,180,92,.4)}
  .rec-defer{color:var(--muted2);background:rgba(139,150,168,.1);border-color:var(--border2)}

  .what{font-size:13px;color:var(--text);margin:8px 0 0;max-width:66ch}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  @media(max-width:560px){.tiles{grid-template-columns:1fr}}
  .tile{border-radius:8px;padding:8px 11px;background:rgba(255,255,255,.028)}
  .tile h4{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.05em}
  .tile.pros h4{color:var(--green)}
  .tile.cons h4{color:var(--amber)}
  .tile ul{margin:0;padding-left:16px}
  .tile li{font-size:12.5px;color:var(--muted);line-height:1.55}

  /* ---------- switch ---------- */
  .switch{position:relative;width:40px;height:23px;flex:none;margin-top:2px;display:inline-block}
  .switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:2}
  .switch .track{position:absolute;inset:0;background:#232a3d;border:1px solid var(--border2);border-radius:999px;transition:background .18s,border-color .18s}
  .switch .knob{position:absolute;top:3px;left:3px;width:15px;height:15px;background:#8b96a8;border-radius:50%;transition:transform .18s,background .18s}
  .switch input:checked + .track{background:var(--accent);border-color:var(--accent)}
  .switch input:checked + .track .knob{transform:translateX(17px);background:#fff}

  /* ---------- summary ---------- */
  .summary{position:sticky;top:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  @media(max-width:920px){.summary{position:static}}
  .summary h2{margin:0 0 12px;font-size:15px;font-weight:650}
  .statrow{display:flex;gap:10px}
  .stat{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
  .stat .num{font-family:var(--mono);font-size:20px;color:var(--text);line-height:1.2}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:3px}
  .stat .num small{font-size:12px;color:var(--muted2)}
  .section-title{font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.05em;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(91,140,255,.35);color:#bcd0ff}
  .empty{font-size:12px;color:var(--muted2)}
  .hint{font-size:12.5px;color:var(--muted);background:var(--amber-soft);border-left:2px solid var(--amber);
    border-radius:0 8px 8px 0;padding:8px 11px;margin-top:12px;line-height:1.6}
  .hint.warn{color:#ffd9a8;background:rgba(255,107,107,.08);border-left-color:var(--danger)}
  .hint.ok{background:var(--green-soft);border-left-color:var(--green);color:#b7f5cf}
  .hint b{color:inherit}

  /* ---------- prompt output ---------- */
  .prompt-area{max-width:1120px;margin:0 auto 48px;padding:0 20px}
  .prompt-box{background:var(--panel2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .prompt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  .prompt-head .pt{font-size:13px;font-weight:600}
  .prompt-head .hint-label{font-size:11.5px;color:var(--muted2);font-weight:400}
  #copyBtn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 18px;font-size:13px;
    cursor:pointer;font-family:var(--sans);transition:background .15s;flex:none}
  #copyBtn:hover{filter:brightness(1.08)}
  #copyBtn.copied{background:var(--green)}
  #prompt{margin:0;padding:16px 18px;font-family:var(--mono);font-size:12.8px;line-height:1.75;
    color:var(--text);white-space:pre-wrap;word-break:break-word;min-height:150px;max-height:340px;overflow:auto}
  footer.note{max-width:1120px;margin:0 auto;padding:0 20px 34px;color:var(--muted2);font-size:11.5px}
</style>
</head>
<body>

<header>
  <h1>Harness 加固 · 选要采纳哪些措施</h1>
  <p class="sub">逐项勾选想采纳的加固措施，右侧会实时生成一份可复制给 Claude 的中文指令。拿不准就从顶部预设方案开始。</p>
  <div class="presets" id="presets"></div>
</header>

<main>
  <section class="groups">
    <div class="group">
      <div class="group-title" id="gtitle-A"></div>
      <div class="cards" id="cards-A"></div>
    </div>
    <div class="group">
      <div class="group-title" id="gtitle-B"></div>
      <div class="cards" id="cards-B"></div>
    </div>
  </section>

  <aside class="summary" id="summary">
    <h2>实时摘要</h2>
    <div class="statrow">
      <div class="stat"><div class="num" id="statA">0 / 4</div><div class="lbl">组 A 反馈验证闭环</div></div>
      <div class="stat"><div class="num" id="statB">0 / 5</div><div class="lbl">组 B 架构约束</div></div>
      <div class="stat"><div class="num" id="statTotal">0 / 9</div><div class="lbl">合计</div></div>
    </div>
    <div class="section-title">组 A 已采纳</div>
    <div class="chips" id="listA"><span class="empty">（未勾选任何项）</span></div>
    <div class="section-title">组 B 已采纳</div>
    <div class="chips" id="listB"><span class="empty">（未勾选任何项）</span></div>
    <div id="hints"></div>
  </aside>
</main>

<section class="prompt-area">
  <div class="prompt-box">
    <div class="prompt-head">
      <span class="pt">给 Claude 的指令 <span class="hint-label">— 只含已采纳项，随勾选实时更新</span></span>
      <button id="copyBtn">复制</button>
    </div>
    <pre id="prompt"></pre>
  </div>
</section>

<footer class="note">本工具只生成决策指令，不做任何修改；拍板后据此补 DECISION 文档并落地实施。</footer>

<script>
  var GROUP_META = {
    A: { title: '组 A · 反馈验证闭环', desc: '让每次改动都被验证、收尾都有据可依' },
    B: { title: '组 B · 架构约束（护栏）', desc: '用机制把已知的坑和红线固化下来' }
  };

  var ITEMS = [
    { id: 'A1', group: 'A', name: '智能检查分流', rec: '推荐',
      what: '改后端代码时自动跑后端测试，改前端代码时自动跑前端检查，不再无差别乱跑。',
      pros: ['后端改动立刻被测试兜住', '消除“改了后端却只检查前端”的浪费'],
      cons: ['每次保存代码多跑几秒检查'],
      short: '改后端自动跑后端测试，改前端自动跑前端检查' },
    { id: 'A2', group: 'A', name: '收尾门禁', rec: '推荐',
      what: 'Claude 说“做完了”之前，必须把整套检查跑通，不过关不允许收尾。',
      pros: ['交付质量从“靠自觉”变成“硬门槛”', '官方最推荐的确定性门禁'],
      cons: ['每次收尾略慢', '大改动过程中可能被中途打断'],
      short: '收尾前强制跑通整套检查，不过关不允许结束' },
    { id: 'A3', group: 'A', name: '独立复核员', rec: '可选',
      what: '删数据、改历史数据这类高风险操作，派一个“独立审核员”再查一遍，不让干活的人自己证明自己干得好。',
      pros: ['能拦住“摘要写错主角”“误删多行”这类真实踩过的坑'],
      cons: ['高风险操作耗时更长', '需要固定一套流程'],
      short: '高风险操作（删数据/改历史）派独立复核员复查' },
    { id: 'A4', group: 'A', name: '出示证据', rec: '推荐',
      what: '要求 Claude 交作业时附上测试输出、命令结果或截图，不许一句“应该没问题”。',
      pros: ['验收更快、可追溯', '官方推荐做法'],
      cons: ['交付说明会变长一点点'],
      short: '交付时附测试输出、命令结果或截图' },

    { id: 'B1', group: 'B', name: '危险操作拦截', rec: '推荐',
      what: '预先拦下三个已知会误删/误跑的坑：回填数据不先预览就执行、某参数用错写法、误触发真实抓取管线。',
      pros: ['三个坑全是真实踩过的，拦一次永不再犯'],
      cons: ['要写几个小拦截脚本（一次性工作）'],
      short: '拦截回填不预览执行、参数等号写法、误触真实管线三个已知坑' },
    { id: 'B2', group: 'B', name: '提交把关', rec: '推荐',
      what: 'git 提交前自动跑整套检查，并禁止把 .env 密钥这类敏感文件提交上去。',
      pros: ['坏提交在本地就被拦下', '防密钥泄漏'],
      cons: ['提交前多等几秒'],
      short: '提交前自动跑检查，并拦截 .env 密钥入暂存' },
    { id: 'B3', group: 'B', name: '前后端隔离规则', rec: '可选',
      what: '用代码规则禁止前端代码偷偷引用后端 Node 代码，结构问题在提交前就暴露。',
      pros: ['架构边界机械化，不会悄悄被破坏'],
      cons: ['需要定制一条检查规则并维护'],
      short: '用代码规则禁止前端引用后端 Node 代码' },
    { id: 'B4', group: 'B', name: '权限收紧', rec: '暂缓',
      what: '给 agent 的操作加更多禁止项或沙箱隔离，防止越界动作。',
      pros: ['安全上更稳妥'],
      cons: ['日常操作可能变繁琐、多弹确认', '本期价值不明确，建议暂缓'],
      short: '给 agent 的操作加更多禁止项或沙箱隔离' },
    { id: 'B5', group: 'B', name: '项目说明瘦身', rec: '暂缓',
      what: '项目说明文件已 160 行偏长，随着模型变强拆掉不再必需的条目。',
      pros: ['防止“说明太长反而被忽略”（官方点名的失败模式）'],
      cons: ['要人工过一遍取舍，建议过段时间再处理'],
      short: '精简过长的项目说明文件' }
  ];

  var REC_CLASS = { '推荐': 'rec-recommend', '可选': 'rec-optional', '暂缓': 'rec-defer' };

  var PRESETS = [
    { name: '均衡推荐', ids: ['A1','A2','A4','B1','B2'], def: true },
    { name: '最小改动', ids: ['A1','B1'] },
    { name: '全面加固', ids: ['A1','A2','A3','A4','B1','B2','B3','B4','B5'] },
    { name: '仅反馈闭环', ids: ['A1','A2','A3','A4'] },
    { name: '仅护栏', ids: ['B1','B2','B3'] }
  ];

  var state = {};
  ITEMS.forEach(function (i) { state[i.id] = false; });

  function itemById(id){ return ITEMS.find(function(x){ return x.id === id; }); }
  function defaultPreset(){ return PRESETS.find(function(p){ return p.def; }); }
  function matchesPreset(p){
    return ITEMS.every(function(i){ return state[i.id] === (p.ids.indexOf(i.id) !== -1); });
  }

  /* ---------- render ---------- */
  function renderPresets(){
    var el = document.getElementById('presets');
    el.innerHTML = '';
    PRESETS.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'preset';
      b.dataset.name = p.name;
      b.innerHTML = p.name + (p.def ? ' <span class="tag">默认</span>' : '');
      b.addEventListener('click', function(){ applyPreset(p); });
      el.appendChild(b);
    });
  }

  function renderCards(){
    ['A','B'].forEach(function (g) {
      document.getElementById('gtitle-' + g).innerHTML =
        '<h2>' + GROUP_META[g].title + '</h2><span class="gdesc">' + GROUP_META[g].desc + '</span>';
      var wrap = document.getElementById('cards-' + g);
      wrap.innerHTML = '';
      ITEMS.filter(function (i) { return i.group === g; }).forEach(function (i) {
        var el = document.createElement('article');
        el.className = 'card';
        el.dataset.id = i.id;
        el.innerHTML =
          '<label class="switch" aria-label="' + i.name + '">' +
            '<input type="checkbox" data-id="' + i.id + '">' +
            '<span class="track"><span class="knob"></span></span>' +
          '</label>' +
          '<div class="card-body">' +
            '<div class="card-head">' +
              '<h3><span class="id">' + i.id + '</span>' + i.name + '</h3>' +
              '<span class="badge ' + REC_CLASS[i.rec] + '">' + i.rec + '</span>' +
            '</div>' +
            '<p class="what">' + i.what + '</p>' +
            '<div class="tiles">' +
              '<div class="tile pros"><h4>好处</h4><ul>' +
                i.pros.map(function (p) { return '<li>' + p + '</li>'; }).join('') +
              '</ul></div>' +
              '<div class="tile cons"><h4>代价 / 风险</h4><ul>' +
                i.cons.map(function (c) { return '<li>' + c + '</li>'; }).join('') +
              '</ul></div>' +
            '</div>' +
          '</div>';
        wrap.appendChild(el);
      });
    });
  }

  function wireEvents(){
    document.querySelectorAll('.card input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function (e) {
        state[e.target.dataset.id] = e.target.checked;
        updateAll();
      });
    });
    document.getElementById('copyBtn').addEventListener('click', copyPrompt);
  }

  function applyPreset(p){
    ITEMS.forEach(function (i) { state[i.id] = p.ids.indexOf(i.id) !== -1; });
    updateAll();
  }

  /* ---------- live update ---------- */
  function updateAll(){
    document.querySelectorAll('.card input[type=checkbox]').forEach(function (cb) {
      cb.checked = state[cb.dataset.id];
      cb.closest('.card').classList.toggle('off', !state[cb.dataset.id]);
    });
    document.querySelectorAll('.preset').forEach(function (b) {
      var p = PRESETS.find(function (x) { return x.name === b.dataset.name; });
      b.classList.toggle('active', matchesPreset(p));
    });
    updateSummary();
    updatePrompt();
  }

  function updateSummary(){
    var adopted = ITEMS.filter(function (i) { return state[i.id]; });
    var a = adopted.filter(function (i) { return i.group === 'A'; });
    var b = adopted.filter(function (i) { return i.group === 'B'; });
    var aTotal = ITEMS.filter(function (i) { return i.group === 'A'; }).length;
    var bTotal = ITEMS.filter(function (i) { return i.group === 'B'; }).length;

    document.getElementById('statA').textContent = a.length + ' / ' + aTotal;
    document.getElementById('statB').textContent = b.length + ' / ' + bTotal;
    document.getElementById('statTotal').textContent = adopted.length + ' / ' + ITEMS.length;

    var listA = document.getElementById('listA');
    var listB = document.getElementById('listB');
    listA.innerHTML = a.length
      ? a.map(function (i) { return '<span class="chip">' + i.id + ' ' + i.name + '</span>'; }).join('')
      : '<span class="empty">（未勾选任何项）</span>';
    listB.innerHTML = b.length
      ? b.map(function (i) { return '<span class="chip">' + i.id + ' ' + i.name + '</span>'; }).join('')
      : '<span class="empty">（未勾选任何项）</span>';

    var hints = document.getElementById('hints');
    var html = '';
    var unadoptedRec = ITEMS.filter(function (i) { return i.rec === '推荐' && !state[i.id]; });
    if (unadoptedRec.length) {
      html += '<div class="hint warn">还有推荐项没勾：<b>' +
        unadoptedRec.map(function (i) { return i.id + ' ' + i.name; }).join('、') +
        '</b>。这几项性价比最高，建议再想想。</div>';
    }
    var deferIds = ['A3','B4','B5'];
    var unadoptedDefer = deferIds.filter(function (id) { return !state[id]; });
    if (unadoptedDefer.length) {
      html += '<div class="hint">现在还要不要做 <b>' +
        unadoptedDefer.map(function (id) { var i = itemById(id); return i.id + ' ' + i.name; }).join('、') +
        '</b>？这三项标为「可选 / 暂缓 / 暂缓」，本期不做也合理。</div>';
    }
    if (!html) {
      html = '<div class="hint ok">已覆盖全部建议项，无需再提醒。</div>';
    }
    hints.innerHTML = html;
  }

  function updatePrompt(){
    var pre = document.getElementById('prompt');
    var adopted = ITEMS.filter(function (i) { return state[i.id]; });
    if (!adopted.length) {
      pre.textContent = '本次暂不采纳任何加固措施，维持现状即可。';
      return;
    }
    var matched = PRESETS.find(function (p) { return matchesPreset(p); });
    var lines = [];
    if (matched) {
      lines.push('本次 Harness 加固采纳「' + matched.name + '」方案（' +
        adopted.map(function (i) { return i.id; }).join('、') + '），请按以下措施实施：');
    } else {
      lines.push('本次 Harness 加固，我决定采纳以下措施，请按此范围实施：');
    }
    lines.push('');
    ['A','B'].forEach(function (g) {
      var gs = adopted.filter(function (i) { return i.group === g; });
      if (!gs.length) return;
      lines.push(g === 'A' ? '组 A 反馈验证闭环：' : '组 B 架构约束（护栏）：');
      gs.forEach(function (i) { lines.push('- ' + i.id + ' ' + i.name + '：' + i.short); });
      lines.push('');
    });
    lines.push('未列入上面的措施，本期不做。');
    pre.textContent = lines.join('\n');
  }

  /* ---------- copy ---------- */
  function fallbackCopy(text, ok){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    ok();
  }
  function copyPrompt(){
    var text = document.getElementById('prompt').textContent;
    var btn = document.getElementById('copyBtn');
    var ok = function () {
      btn.textContent = '已复制！';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text, ok); });
    } else {
      fallbackCopy(text, ok);
    }
  }

  /* ---------- init: default preset 均衡推荐 ---------- */
  renderPresets();
  renderCards();
  wireEvents();
  applyPreset(defaultPreset());
</script>
</body>
</html>
