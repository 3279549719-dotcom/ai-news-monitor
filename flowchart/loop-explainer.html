<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop 三层拆解 · Harness 讲解器</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#2d333b;
    --fg:#e6edf3; --dim:#8b949e; --mut:#6e7681;
    --green:#3fb950; --greenBg:rgba(63,185,80,.12); --amber:#d29922; --amberBg:rgba(210,153,34,.12);
    --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding:24px; }
  header h1 { font-size:22px; letter-spacing:.3px; }
  header p { color:var(--dim); font-size:13px; margin-top:4px; }
  .tagline { color:var(--mut); font-size:12px; }
  .layout { display:grid; grid-template-columns:340px 1fr; gap:20px; margin-top:18px; align-items:start; }
  aside, .preview, .promptbox { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:14px 0 8px; }
  h3:first-child { margin-top:0; }
  .card { display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:border-color .15s; color:var(--fg); }
  .card:hover { border-color:var(--blue); }
  .card.sel { border-color:var(--blue); background:rgba(88,166,255,.08); }
  .card .t { font-weight:600; font-size:14px; }
  .card .s { color:var(--dim); font-size:12px; margin-top:2px; }
  .card .badge { display:inline-block; font-size:10px; padding:1px 7px; border-radius:99px; margin-left:6px; vertical-align:2px; }
  .badge.cur { background:var(--greenBg); color:var(--green); }
  .chk { display:flex; align-items:flex-start; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .chk input { margin-top:4px; accent-color:var(--green); width:16px; height:16px; }
  .chk .n { font-size:13px; font-weight:600; }
  .chk .d { font-size:12px; color:var(--dim); }
  .chk .st { margin-left:auto; font-size:11px; color:var(--mut); white-space:nowrap; }
  .chk.on { border-color:rgba(63,185,80,.5); background:var(--greenBg); }
  .presets { display:flex; flex-wrap:wrap; gap:6px; }
  .presets button { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:99px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .presets button:hover { border-color:var(--purple); }
  .presets button.sel { border-color:var(--purple); background:rgba(188,140,255,.12); }
  .adv { font-size:12px; color:var(--dim); margin-top:10px; }
  .adv input { accent-color:var(--purple); }
  /* preview */
  .preview h2 { font-size:16px; }
  .diagram { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:10px; }
  svg text { font-family:inherit; }
  .ready { margin-top:12px; font-size:12px; color:var(--dim); }
  .ready .bar { height:8px; background:var(--panel2); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:6px; }
  .ready .fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--green),#56d364); transition:width .3s; }
  .detail { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
  .detail .q { font-size:13px; color:var(--dim); }
  .detail blockquote { border-left:3px solid var(--blue); padding:6px 12px; margin:8px 0; color:var(--dim); font-size:13px; font-style:italic; }
  .detail .sec { margin-top:8px; font-size:13px; }
  .detail .sec b { color:var(--fg); }
  .detail .ok { color:var(--green); } .detail .no { color:var(--red); }
  /* prompt */
  .promptbox { margin-top:20px; }
  .promptbox .head { display:flex; align-items:center; justify-content:space-between; }
  .promptbox button { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 14px; font-size:13px; cursor:pointer; }
  .promptbox button:hover { border-color:var(--green); }
  .prompt { margin-top:10px; background:#0b0f14; border:1px solid var(--line); border-radius:10px; padding:14px; font:13px/1.7 "SFMono-Regular",Consolas,"Courier New",monospace; white-space:pre-wrap; color:#9ecbff; }
  .src { color:var(--mut); font-size:11px; margin-top:6px; }
  .src a { color:var(--blue); text-decoration:none; }
  .nodim { color:var(--mut); }
  @media (max-width:900px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>🔄 Loop 三层拆解 · 你的 Harness「循环」讲解器</h1>
  <p>官方 harness = <b>loop · tools · context management · guardrails</b>。<span class="tagline">本项目已在 loop 反馈闭环（F-016）与护栏上补了地基——本页帮你定位「loop」这个词的三层含义、你已经做到了什么、接下来怎么优化。</span></p>
</header>

<main class="layout">
  <aside>
    <h3>① 你指的是哪一种 Loop？</h3>
    <div id="meaningCards"></div>

    <h3>② 自主交付 Loop 的五要素（勾选你已具备的）</h3>
    <div id="essentials"></div>

    <h3>③ 快照</h3>
    <div class="presets" id="presets"></div>

    <div class="adv"><label><input type="checkbox" id="multiAgent"> 进阶：多 agent 并行 / 子任务编排</label></div>
  </aside>

  <section class="preview">
    <h2 id="pvTitle">自主交付 Loop 图景</h2>
    <div class="diagram" id="diagram"></div>
    <div class="ready" id="readiness"></div>
    <div class="detail" id="detail"></div>
  </section>
</main>

<section class="promptbox">
  <div class="head"><h3 style="margin:0">📋 下一步建议（可复制给 Claude）</h3><button id="copy">复制建议</button></div>
  <div class="prompt" id="prompt"></div>
  <div class="src" id="src"></div>
</section>

<script>
"use strict";
const MEANINGS = {
  l1: {
    title: "① 调度 / 定时 Loop",
    tag: "谁来唤醒 · 多久一次",
    summary: "周期性或自动触发的机制：定时巡查 issue、定时做系统运维检查。对应 Claude Code 的 /loop 命令、cron 定时任务、headless 模式（claude -p 接入系统计划任务），以及本项目已有的 Windows 任务计划。",
    official: "Claude Code 官方文档把「定时 loop」拆成三层：① 内置 <b>skill <code>/loop</code></b>——「Run a prompt repeatedly while the session stays open」，可固定间隔、可让 Claude 自定节奏、空参时跑内置维护提示或 <code>.claude/loop.md</code>；② 会话内<b>定时任务</b>——自然语言触发 <code>CronCreate/CronList/CronDelete</code>（如「remind me at 3pm to push the release branch」），会话级、7 天自动过期、本机时区；③ <b>无头模式 <code>claude -p</code></b>——「exits with code 0 on success and a non-zero code when the run fails」，可接入系统计划任务无人值守（配 <code>--allowedTools</code> 限定权限）。官方用途：poll a deployment / babysit a PR / check a long-running build。",
    essence: "本质是「触发器」：决定 agent 何时醒来、以什么频率重复同一类任务。它不改变 agent 怎么思考，只保证「该干的活按时干」。",
    now: "<span class='ok'>✅ 已有雏形</span>：Windows 任务计划 <code>ai-news-monitor-daily</code>（每日 08:00 跑数据管线）——等价「claude -p + 系统计划任务」路线，但用的是纯 node 而非 AI。<br><span class='no'>❌ 缺口</span>：没有「issue 巡查 / Docker·磁盘·日志·Supabase 健康检查」这类运维 loop；<code>/loop</code>、自然语言定时任务、云 Routines 都未接入。⚠️ 官方 sandbox 不支持原生 Windows，长时无人值守建议走 WSL2 或容器。",
    adv: "补一个 <b>ops 定时巡查</b>，两条路线：(a) 便宜起步——系统任务计划跑 <code>scripts/ops-check.js</code>，检查 crawl4ai/Docker 健康、磁盘余量、pipeline 日志失败、Supabase 近 24h 新文章，异常才写中文报告；(b) 进阶——任务计划调 <code>claude -p --allowedTools ...</code>，让 AI 参与巡查并汇总（复用现有 run-pipeline 思路）。"
  },
  l2: {
    title: "② 执行范式 Loop（Agentic Loop / ReAct）",
    tag: "每一步怎么想 · 怎么做",
    summary: "agent 完成任务时的推理-行动循环。官方不叫 ReAct——Claude Code 文档叫「gather context → take action → verify results」，Building effective agents 叫「LLMs using tools based on environmental feedback in a loop」。",
    official: "官方《Agent Harness Design》：harness = 「the software scaffolding around a model: <b>the loop</b>, tools, context management, and guardrails」；「Claude emits tool calls, which are handled by the harness」。companion 文档把循环展开为「gather context → take action → verify results」，且「Each tool use returns information that feeds back into the loop」。⚠️ <b>诚实核查</b>：harness 原文<b>没用「ReAct」一词</b>——那是社区的叫法，但官方三阶段结构上等价于 ReAct。",
    essence: "本质是「思考-行动器」：每步决定调哪个工具、看结果、再决定下一步。这决定了为什么工具护栏重要——护栏正好插在 Act 这一步上（B1/B2 就是这么生效的）。",
    now: "<span class='ok'>✅ Claude Code 本身就是这个循环</span>（无需配置）。F-016 的 A1/A2/A4 已保证「verify results」这一环拿到<b>真实</b>反馈——这正是官方三阶段里最容易漏的一环。<br><span class='no'>❌</span> 无缺口，无需额外配置。",
    adv: "无需额外优化。维护「验证 = 真实反馈」：改代码→自动跑检查（A1）、收尾强制全套（A2）、交付附证据（A4），让 verify 永远基于事实而非「看起来对」。"
  },
  l3: {
    title: "③ Loop Engineering · 自主交付 Loop",
    tag: "整段任务生命周期自主运转",
    summary: "以小时为单位的长时自主工作：给几句话 + 目标 + 验收标准，agent 调研→设计→实现→验证→交付全流程自主跑，人只审最终结果。",
    official: "官方叫它 <b>designing loops</b>：loops = 「agents repeating cycles of work until a stop condition is met」。⚠️ <b>诚实核查</b>：『loop engineering』是<b>社区词</b>——Anthropic 官方博客原文「There's a lot of talk right now about loop engineering…」自己把它归于外部讨论。但底层原则全有官方出处：给 check 验证自己（「the difference between a session you watch and one you walk away from」）、出示证据而非宣称成功、外部进度文件（「A fresh session has no memory of what the previous one did」→ 写 PROGRESS.md + git checkpoint）、开工前定成功标准（「Define clear success and stop criteria」）、reversibility 门禁（「hard-to-reverse actions such as external API calls can be gated by user confirmation」）。",
    essence: "本质是「生产线」：把 ①唤醒 + ②Agentic loop 编排成一个自驱动大循环，支撑件就是右侧五要素。官方对「人只看最终结果」的限定：那是<b>无人值守定时 loop</b>的设计目标（「with no human in real time」）；长任务仍保留中途可观测/可干预（AGENT_STOP / STEER.md、checkpoint、git log 即第二记录）。",
    now: "<span class='ok'>✅ 地基刚打好</span>：F-016 补上反馈验证闭环（A1/A2/A4 hooks）+ 架构护栏（B1/B2）；项目已有 REQ/DECISION/PLAN/PROGRESS 文档体系 ≈ 官方 long-running-agents 仓库的 PROGRESS.md 模式；npm run check + Stop 门禁正是「Give Claude a check it can run」。<br><span class='no'>❌ 缺口</span>：没把「一句话目标 → 自动跑完整流程」落成协议；没单任务 checkpoint；没定时运维巡查；<code>/goal</code>、background 会话、agent view 未启用。",
    adv: "把「自主交付协议」文档化为项目规则：开工写 目标 + 验收标准 + 进度文件路径，每阶段更新 PROGRESS（REQ/DECISION/PROGRESS 体系已具备），收尾强制 npm run check（Stop hook 已做），硬反向操作保持人工确认（B1/B2 已落地 reversibility 门禁）。进阶：<code>/goal</code> 设完成条件让会话自动续跑，多 agent 子任务并行编排。"
  }
};

const ESSENTIALS = [
  { id:"trigger",    label:"定时 / 触发机制", d:"让 loop 能自动醒来（cron / /loop / 系统任务计划）" },
  { id:"progress",   label:"外部进度文件",     d:"可断点续传、可中途审阅的进度记录（如 PROGRESS.md / checkpoint）" },
  { id:"acceptance", label:"明确验收标准",     d:"开工前定好 exit condition / 验收矩阵（判定式）" },
  { id:"feedback",   label:"反馈验证闭环",     d:"执行中自带验证（检查/测试/证据），不过关不交付" },
  { id:"guardrail",  label:"权限授权与边界",   d:"授权自主执行 + 硬反向动作护栏（reversibility 门控）" }
];

const PRESETS = [
  { id:"current",  name:"现状诊断",          m:"l3", on:["feedback"],             multi:false },
  { id:"ops",      name:"第一步 · 补定时巡查", m:"l1", on:["trigger","feedback"],   multi:false },
  { id:"full",     name:"完整自主 Loop",     m:"l3", on:["trigger","progress","acceptance","feedback","guardrail"], multi:false },
  { id:"advanced", name:"进阶 · 多 agent",   m:"l3", on:["trigger","progress","acceptance","feedback","guardrail"], multi:true }
];

const state = { meaning:"l3", on:{}, multi:false };
ESSENTIALS.forEach(e => state.on[e.id] = e.id==="feedback"); // 默认：反馈闭环已具备

/* ---------- render ---------- */
const $ = id => document.getElementById(id);

function renderMeanings(){
  $("meaningCards").innerHTML = Object.keys(MEANINGS).map(k => {
    const m = MEANINGS[k], sel = state.meaning===k;
    return `<div class="card ${sel?"sel":""}" data-m="${k}">
      <span class="t">${m.title}</span>
      ${k==="l3"?'<span class="badge cur">重点</span>':""}
      <div class="s">${m.tag}</div></div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { state.meaning=c.dataset.m; renderAll(); });
}

function renderEssentials(){
  $("essentials").innerHTML = ESSENTIALS.map(e => {
    const on = state.on[e.id];
    return `<div class="chk ${on?"on":""}" data-id="${e.id}">
      <input type="checkbox" ${on?"checked":""}>
      <div><div class="n">${e.label}</div><div class="d">${e.d}</div></div>
      <span class="st">${on?"✓ 已具备":"· 缺失"}</span></div>`;
  }).join("");
  document.querySelectorAll(".chk").forEach(c => c.onclick = () => {
    const id = c.dataset.id; state.on[id] = !state.on[id]; renderAll();
  });
}

function renderPresets(){
  $("presets").innerHTML = PRESETS.map(p => `<button data-p="${p.id}">${p.name}</button>`).join("");
  document.querySelectorAll("#presets button").forEach(b => b.onclick = () => {
    const p = PRESETS.find(x => x.id===b.dataset.p);
    state.meaning = p.m; state.multi = p.multi;
    ESSENTIALS.forEach(e => state.on[e.id] = p.on.includes(e.id));
    renderAll();
  });
}

function renderDiagram(){
  const svg = 520, cy = 130, R = 88; // ring radius
  const steps = [
    { t:"调研", k:"trigger" }, { t:"设计", k:"acceptance" },
    { t:"实现", k:"guardrail" }, { t:"验证", k:"feedback" },
    { t:"交付", k:"feedback" }
  ];
  const N = steps.length;
  let parts = `<svg viewBox="0 0 ${svg} 300" width="100%" style="display:block">
    <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/></marker></defs>`;
  // center node
  parts += `<circle cx="${svg/2}" cy="150" r="54" fill="rgba(88,166,255,.08)" stroke="${state.meaning==="l3"?"#58a6ff":"#2d333b"}" stroke-width="2"/>
    <text x="${svg/2}" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="${state.meaning==="l3"?"#58a6ff":"#6e7681"}">自主</text>
    <text x="${svg/2}" y="164" text-anchor="middle" font-size="12" fill="#8b949e">交付 Loop</text>`;
  // progress track (external progress file) — a band around center
  const progOn = state.on.progress;
  parts += `<circle cx="${svg/2}" cy="150" r="${R+20}" fill="none" stroke="${progOn?"#3fb950":"#2d333b"}" stroke-width="6" opacity="${progOn?0.35:0.25}" stroke-dasharray="4 6"/>
    <text x="${svg/2}" y="${150-R-12}" text-anchor="middle" font-size="11" fill="${progOn?"#3fb950":"#6e7681"}">📄 ${progOn?"外部进度文件（可断点/可审阅）":"进度文件 · 缺失"}</text>`;
  // step nodes on ring
  for (let i=0;i<N;i++){
    const a = -Math.PI/2 + i*(2*Math.PI/N);
    const x = svg/2 + R*Math.cos(a), y = 150 + R*Math.sin(a);
    const on = state.on[steps[i].k];
    const fill = on ? "rgba(63,185,80,.15)" : "rgba(22,27,34,1)";
    const st = on ? "#3fb950" : "#3d444d";
    parts += `<circle cx="${x}" cy="${y}" r="26" fill="${fill}" stroke="${st}" stroke-width="2"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="600" fill="${on?"#3fb950":"#6e7681"}">${steps[i].t}</text>`;
    // arrows between steps
    const b = -Math.PI/2 + (i+1)*(2*Math.PI/N);
    const x2 = svg/2 + R*Math.cos(b), y2 = 150 + R*Math.sin(b);
    const mx = (x+x2)/2 + (y-y2)*0.06, my = (y+y2)/2 + (x2-x)*0.06;
    parts += `<path d="M${x+26*Math.cos(a)} ${y+26*Math.sin(a)} Q${mx} ${my} ${x2-26*Math.cos(b)} ${y2-26*Math.sin(b)}" fill="none" stroke="${state.on.feedback?"#3fb950":"#3d444d"}" stroke-width="1.6" marker-end="url(#arr)" opacity="0.8"/>`;
  }
  // entry trigger
  const trig = state.on.trigger;
  parts += `<path d="M${svg/2-120} 70 Q${svg/2-60} 40 ${svg/2-20} 60" fill="none" stroke="${trig?"#3fb950":"#3d444d"}" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
    <text x="${svg/2-128}" y="56" font-size="11" fill="${trig?"#3fb950":"#6e7681"}">${trig?"▶ 定时/触发":"触发 · 缺失"}</text>`;
  parts += `</svg>`;
  $("diagram").innerHTML = parts;
  $("pvTitle").textContent = MEANINGS[state.meaning].title + " · " + MEANINGS[state.meaning].tag;
}

function renderReadiness(){
  const total = ESSENTIALS.length, on = ESSENTIALS.filter(e=>state.on[e.id]).length;
  const pct = Math.round(on/total*100);
  const label = pct===100 ? "🚀 已具备全要素，可以无人值守交付"
    : pct>=60 ? "🧱 地基稳了，补上缺口即可长时间自主"
    : pct>=20 ? "🌱 刚起步，先补最缺的一环"
    : "🪫 仅靠自觉，难以长时自主";
  $("readiness").innerHTML = `自主交付就绪度 <b style="color:#3fb950">${on}/${total}</b>（${pct}%）· ${label}
    <div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
}

function renderDetail(){
  const m = MEANINGS[state.meaning];
  $("detail").innerHTML = `
    <div class="q">${m.summary}</div>
    <blockquote>${m.official}</blockquote>
    <div class="sec"><b>它的本质</b>：${m.essence}</div>
    <div class="sec"><b>本项目现状</b>：<br>${m.now}</div>
    <div class="sec"><b>优化建议</b>：${m.adv}</div>`;
}

function renderPrompt(){
  const on = ESSENTIALS.filter(e=>state.on[e.id]).map(e=>e.label);
  const off = ESSENTIALS.filter(e=>!state.on[e.id]).map(e=>e.label);
  const m = MEANINGS[state.meaning];
  const P = [];
  P.push(`【${m.title} · 优化建议】`);
  if (state.meaning==="l1"){
    P.push(`我当前只有每日 08:00 的数据管线定时任务，缺一个「运维巡查」loop。`);
    P.push(`请按此协议实施：用系统任务计划新增 scripts/ops-check.js 每日巡检 —— crawl4ai/Docker 健康、磁盘余量、logs/pipeline-*.log 最近一次是否成功、Supabase 近 24h 是否有新文章；仅在异常时输出中文报告。自带 --dry-run 预览，动作可逆。`);
  } else if (state.meaning==="l2"){
    P.push(`执行范式 loop 无需额外配置（Claude Code 内建 ReAct）。请自查一次：B1/B2 护栏是否仍覆盖三条已知 footgun，A1 分流是否在改前端/后端时触发对应检查。`);
  } else {
    P.push(`目标：把「一句话 → 自主交付」落成本项目协议，支撑以小时为单位的长时间工作。`);
    P.push(`已具备：${on.join("、")||"无"}${state.multi?"，且准备启用多 agent 并行编排":""}。`);
    P.push(`缺口：${off.join("、")||"无"}。`);
    if (off.includes("定时 / 触发机制")) P.push(`- 定时：用系统任务计划补 ops 巡检（scripts/ops-check.js，异常才报告）。`);
    if (off.includes("外部进度文件")) P.push(`- 进度：为长任务建 PROGRESS-<task>.md 作 checkpoint，每阶段更新 状态/证据/下一步（沿用现有 REQ/DECISION/PROGRESS 体系）。`);
    if (off.includes("明确验收标准")) P.push(`- 验收：开工前在 REQ 写判定式验收矩阵（检查项 × 通过标准），收尾逐项回填。`);
    if (off.includes("反馈验证闭环")) P.push(`- 闭环：靠 harness hooks（A1 分流 / A2 Stop 门禁 / A4 证据）强制验证，不过关不收尾。`);
    if (off.includes("权限授权与边界")) P.push(`- 边界：普通操作自动允许，删数据/写库/外部调用保持人工确认（B1/B2 已落地 reversibility 门控）。`);
    if (state.multi) P.push(`- 进阶：大任务按 调研/设计/实现/验证 拆子 agent 并行，主 agent 汇总与门禁（可用 Workflow 编排）。`);
    P.push(`请按上述缺口的可执行动作逐项实施，并更新 PROGRESS.md 记录本协议。`);
  }
  $("prompt").textContent = P.join("\n");
  $("src").innerHTML = `引用 · claude.com/blog/harnessing-claudes-intelligence · claude.com/blog/getting-started-with-loops · anthropic.com/engineering/{building-effective-agents,built-multi-agent-research-system} · github.com/anthropics/cwc-long-running-agents · code.claude.com/docs/en/{scheduled-tasks,headless,permission-modes,hooks-guide,goal,sub-agents,checkpointing,best-practices,how-claude-code-works}.md ——引文细节见讲解卡「官方解释」；「ReAct」「loop engineering」两词社区/官方归属已诚实标注。`;
}

function renderAll(){ renderMeanings(); renderEssentials(); renderPresets(); renderDiagram(); renderReadiness(); renderDetail(); renderPrompt(); }

/* copy */
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("prompt").textContent); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=$("prompt").textContent; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const b=$("copy"); const old=b.textContent; b.textContent="已复制 ✓"; setTimeout(()=>b.textContent=old,1200);
};

renderAll();
</script>
