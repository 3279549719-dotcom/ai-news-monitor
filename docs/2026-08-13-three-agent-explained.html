<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三代理实验 · 小白图解</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2230;
    --border: #2d333b;
    --text: #e6edf3;
    --muted: #8b949e;
    --blue: #58a6ff;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6; padding: 24px; max-width: 1000px; margin: 0 auto;
  }
  header { margin-bottom: 18px; }
  h1 { font-size: 24px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* 顶栏控件 */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 16px;
  }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: all .15s;
  }
  .btn:hover { border-color: var(--blue); }
  .btn.active { background: var(--blue); color: #0d1117; border-color: var(--blue); font-weight: 600; }
  .toolbar .sep { flex: 1; }
  .viewgroup { display: flex; gap: 6px; }

  /* 术语开关 */
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--blue); width: 16px; height: 16px; cursor: pointer; }
  em.term { font-style: normal; color: var(--purple); font-family: var(--mono); font-size: 12px; }
  /* 默认白话模式：隐藏术语 */
  body.terms em.term { display: inline; }
  body:not(.terms) em.term { display: none; }

  /* 主区 */
  .stage {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .stage-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
  .badge.b { background: rgba(88,166,255,.15); color: var(--blue); }
  .badge.g { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.a { background: rgba(210,153,34,.15); color: var(--amber); }
  .badge.r { background: rgba(248,81,73,.15); color: var(--red); }
  .stepno { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  h2 { font-size: 20px; }
  .svgwrap { text-align: center; margin: 8px 0 4px; }
  .svgwrap svg { max-width: 100%; height: auto; }
  .plain { font-size: 15px; margin-top: 8px; }
  .points { margin-top: 10px; list-style: none; }
  .points li { font-size: 14px; padding: 5px 0 5px 24px; position: relative; color: #c9d1d9; }
  .points li::before { content: "▸"; position: absolute; left: 4px; color: var(--blue); }
  .code { font-family: var(--mono); background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12px; color: #e3b341; }
  .statusline { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--muted); }

  /* 底部 prompt */
  .promptbox {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 30px;
  }
  .promptbox .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .promptbox .head span { font-size: 13px; color: var(--muted); font-weight: 600; }
  .copybtn { background: var(--green); color: #0d1117; border: none; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; transition: transform .1s; }
  .copybtn:active { transform: scale(.95); }
  #prompt { white-space: pre-wrap; font-size: 14px; line-height: 1.7; color: var(--text); }

  /* 导航箭头 */
  .nav { display: flex; gap: 8px; align-items: center; }
  .arrow { background: var(--panel2); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .arrow:hover:not(:disabled) { border-color: var(--blue); }
  .arrow:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background .15s; }
  .dot.active { background: var(--blue); }

  /* 全景图 / 结论模式 */
  .timeline { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
  .tl-item { display: flex; gap: 14px; }
  .tl-rail { display: flex; flex-direction: column; align-items: center; }
  .tl-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); margin-top: 4px; }
  .tl-rail::after { content: ""; width: 2px; flex: 1; background: var(--border); margin-top: 4px; }
  .tl-card { flex: 1; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tl-card b { display: block; margin-bottom: 4px; }
  .tl-card p { font-size: 13.5px; color: #c9d1d9; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .col { border-radius: 10px; padding: 14px; border: 1px solid var(--border); }
  .col.done { background: rgba(63,185,80,.07); border-color: rgba(63,185,80,.4); }
  .col.hang { background: rgba(210,153,34,.07); border-color: rgba(210,153,34,.4); }
  .col h3 { font-size: 14px; margin-bottom: 8px; }
  .col.done h3 { color: var(--green); } .col.hang h3 { color: var(--amber); }
  .col ul { list-style: none; } .col li { font-size: 13.5px; padding: 4px 0; color: #c9d1d9; }
  .verdict { margin-top: 12px; font-size: 14px; color: var(--text); }
  .hidden { display: none; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0 30px; }
</style>
</head>

  <h1>「三代理实验」· 小白图解</h1>
  <div class="sub">2026-08-11 我们做了一个实验：把 Anthropic 官方说的「3 个 AI 分工协作」搬到这个项目里跑了一趟。<br>这里是那天发生了什么、结论是什么、现在还剩什么。</div>
</header>

    <button class="arrow" id="next">→</button>
  </nav>
  <div class="sep"></div>
  <div class="viewgroup">
    <button class="btn active" data-view="steps">按步骤看</button>
    <button class="btn" data-view="timeline">一图流</button>
    <button class="btn" data-view="verdict">只看结论</button>
  </div>
  <label class="toggle"><input type="checkbox" id="termsToggle"> 显示术语</label>
</div>

<div id="stage"></div>

<div class="promptbox">
  <div class="head">

    <button class="copybtn" id="copy">复制</button>
  </div>
  <div id="prompt"></div>

<footer>AI-news-monitor · 2026-08-13 · 数据来自 docs/DECISION-三代理架构-自审评估.md</footer>

        <text x="180" y="98" text-anchor="middle" fill="#c9d1d9" font-size="11.5">每天 08:00 自动抓取 → AI 评分 → 入库 → 日报</text>
        <text x="180" y="120" text-anchor="middle" fill="#8b949e" font-size="11">Windows 定时任务已退役</text>
        <text x="180" y="142" text-anchor="middle" fill="#8b949e" font-size="11">= 那次实验唯一的实际遗产</text>
        <text x="540" y="24" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">⚠️ 悬空（残留）</text>
        <rect x="400" y="40" width="280" height="130" rx="12" fill="rgba(210,153,34,.08)" stroke="#d29922"/>
        <text x="540" y="72" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">Generator 的半成品（stub）</text>
        <text x="540" y="94" text-anchor="middle" fill="#c9d1d9" font-size="11">5 个文件没提交 · 抓取层写死返回空</text>
        <text x="540" y="113" text-anchor="middle" fill="#c9d1d9" font-size="11">警报函数不存在 · AI 兜底没接</text>
        <text x="540" y="134" text-anchor="middle" fill="#8b949e" font-size="11">4 个实验工作区 + 分支未清理</text>
        <text x="540" y="154" text-anchor="middle" fill="#8b949e" font-size="11">后续「自愈」走了另一条路，与它无关</text>
        <text x="360" y="215" text-anchor="middle" fill="#8b949e" font-size="12">一句话：成果 = 定时任务搬上 GitHub；代价 = 一堆没写完的实验文件</text>
      </g>
    </svg>`,
    summary: '成果：定时管线搬上 GitHub（每天在跑）。残留：Generator 的半成品代码 + 4 个没清理的实验工作区。',
  },
];

// 全景时间线数据（供「一图流」）
const timeline = [
  { head: '8/11 ｜ Anthropic 原版 vs 我们的搭法', p: '官方要 3 个独立大脑；我们搭的是 1 个老板（主会话）+ 2 个员工（subagent），用 worktree 物理隔离 + 文件交接。自审承认：这是「单会话指挥 subagent」，不是真正的独立 brain。' },
  { head: '8/11 ｜ 真任务实战：管线搬 GitHub', p: 'Planner 出计划 → Generator 照做 → Evaluator 独立重跑验收（118 测试全过）→ PASS 合入。Evaluator 独立抓到 3 个小问题。协议验证成立。' },
  { head: '8/11 ｜ 4 处代码坑（自审发现）', p: 'Generator 的「突发新闻自愈」代码：抓取层是 stub（写死返回空）、警报函数根本不存在、LLM 兜底没实现、危险路径无测试。诚实写进评估文档。' },
  { head: '8/11 ｜ 3 处偏差（对比原文）', p: '① 合同没走「对等协商」而是老板单方下发；② worktree 隔离 ≠ 独立大脑 + 清空记忆；③ 所谓护栏其实来自 Claude Code 而非那篇文章。' },
  { head: '8/13 ｜ 今天的状态', p: '唯一遗产 = 每日管线搬上 GitHub（现在每天在跑）。Generator 那 5 个半成品没提交，躺在实验工作区；4 个 worktree 挂着未清理。后续「自愈」功能走了另一条路实现。' },
];

// 结论数据（供「只看结论」）
const verdictCols = {
  done: { title: '✅ 值得记住的（已落地）', items: ['三代理「文件交接协议」验证成立：计划→照做→独立复核→合入，全程落盘可查', 'Evaluator 独立复核真的有用：抓到「邮件开关没配会发空邮件」', '那次实验的成果 = 定时管线搬上 GitHub（现在每天 8 点在跑）'] },
  hang: { title: '⚠️ 还挂着的（残留）', items: ['Generator 写的 5 个「自愈」半成品没提交（抓取层写死返回空、警报函数不存在、AI 兜底没接）', '4 个实验工作区 + 分支没清理', '「真正的独立大脑」没做，也只建议在开放设计任务上才投入'] },
};
const verdictLine = '总结：实验的协议部分成功、落地了一件事（CI 定时）、留下了一批没写完的文件。后续「自愈」功能没有用那批半成品，而是另起炉灶实现的。';

// ============ 渲染 ============
const stage = document.getElementById('stage');
const promptEl = document.getElementById('prompt');
const stepLabel = document.getElementById('stepLabel');
const dots = document.getElementById('dots');

function esc(s){return s;}

function buildDots(){
  dots.innerHTML = '';
  steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === D.step ? ' active' : '');
    d.onclick = () => { D.step = i; render(); };
    dots.appendChild(d);
  });
}

function renderSteps(){
  const s = steps[D.step];
  stepLabel.textContent = `第 ${D.step+1}/4 步`;
  document.getElementById('prev').disabled = D.step === 0;
  document.getElementById('next').disabled = D.step === steps.length - 1;
  buildDots();
  stage.innerHTML = `
    <div class="stage">
      <div class="stage-top">
        <span class="badge ${s.badge[0]}">${s.badge[1]}</span>
        <h2>${s.title}</h2>
      </div>
      <div class="svgwrap">${s.svg}</div>
      <p class="plain">${s.plain}</p>
      <ul class="points">${s.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <div class="statusline">📌 这句是重点：${s.summary}</div>
    </div>`;
  promptEl.textContent = `【三代理实验 · 第${D.step+1}步｜${s.title}】\n\n${s.plain.replace(/<[^>]+>/g,'')}\n\n重点：${s.summary}`;
}

function renderTimeline(){
  stepLabel.textContent = '全景图';
  stage.innerHTML = `<div class="stage">
    <div class="stage-top"><span class="badge b">一图流</span><h2>实验全时间线</h2></div>
    <div class="timeline">${timeline.map(t => `
      <div class="tl-item">
        <div class="tl-rail"><div class="tl-dot"></div></div>
        <div class="tl-card"><b>${t.head}</b><p>${t.p}</p></div>
      </div>`).join('')}
    </div>
    <div class="statusline">📌 一句话：协议成功了，落地了一件事（CI），留下一批没写完的文件。</div>
  </div>`;
  promptEl.textContent = `【三代理实验 · 全景】\n\n${timeline.map(t => '· '+t.head+' — '+t.p.replace(/<[^>]+>/g,'')).join('\n')}`;
}

function renderVerdict(){
  stepLabel.textContent = '只看结论';
  stage.innerHTML = `<div class="stage">
    <div class="stage-top"><span class="badge g">结论</span><h2>现在该知道的 3 件事</h2></div>
    <div class="cols">
      <div class="col done"><h3>${verdictCols.done.title}</h3><ul>${verdictCols.done.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>
      <div class="col hang"><h3>${verdictCols.hang.title}</h3><ul>${verdictCols.hang.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>
    </div>
    <p class="verdict">${verdictLine}</p>
    <div class="statusline">📌 需要你决定的事：那批没写完的实验文件（半成品）要不要清理？4 个工作区要不要收？——不急，想清楚再说。</div>
  </div>`;
  promptEl.textContent = `【三代理实验 · 结论】\n\n✅ 落地：${verdictCols.done.items.join('；')}\n⚠️ 残留：${verdictCols.hang.items.join('；')}\n\n${verdictLine}`;
}

function render(){
  if (D.view === 'steps') renderSteps();
  else if (D.view === 'timeline') renderTimeline();
  else renderVerdict();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === D.view));
}

// ============ 事件 ============
document.getElementById('prev').onclick = () => { D.step = Math.max(0, D.step-1); render(); };
document.getElementById('next').onclick = () => { D.step = Math.min(steps.length-1, D.step+1); render(); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { D.view = b.dataset.view; render(); });
document.getElementById('termsToggle').onchange = e => { D.terms = e.target.checked; document.body.classList.toggle('terms', D.terms); };
document.getElementById('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(promptEl.textContent);
    const b = document.getElementById('copy');
    b.textContent = '已复制 ✓';
    setTimeout(() => b.textContent = '复制', 1200);
  } catch(e) {
    // 兜底：老浏览器
    const ta = document.createElement('textarea');
    ta.value = promptEl.textContent; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
};

// 初始化
document.getElementById('termsToggle').checked = true;
document.body.classList.add('terms');
render();
</script>
