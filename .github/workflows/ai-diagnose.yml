name: AI Diagnose
on:
  workflow_run:
    workflows: [".github/workflows/ops-check.yml"]
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  diagnose:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Download ops-check artifact + failed logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./diag
          gh run download ${{ github.event.workflow_run.id }} -n ops-check-result -D ./diag || echo "no artifact"
          gh run view ${{ github.event.workflow_run.id }} --log-failed > ./diag/failed.log 2>/dev/null || echo "no failed log"
          echo "=== ops-check result ===" >> ./diag/materials.txt
          cat ./diag/ops-check-result/.ops-check.json 2>/dev/null >> ./diag/materials.txt || cat ./diag/ops-check-result/*.json 2>/dev/null >> ./diag/materials.txt || echo "(no ops-check json)" >> ./diag/materials.txt
          echo "" >> ./diag/materials.txt
          echo "=== failed run logs ===" >> ./diag/materials.txt
          cat ./diag/failed.log >> ./diag/materials.txt
      - name: AI diagnose with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          node scripts/ai-diagnose.js --ci < ./diag/materials.txt > ./diag/diagnosis.md 2> ./diag/diagnose.err || {
            echo "## 诊断服务暂不可用" > ./diag/diagnosis.md
            echo "" >> ./diag/diagnosis.md
            echo "AI 诊断调用失败，详情：" >> ./diag/diagnosis.md
            cat ./diag/diagnose.err >> ./diag/diagnosis.md
          }
      - name: Find related issue and post diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ISSUE_NUM=$(gh issue list --search "Run ${RUN_ID} in:title" --state open --json number --jq '.[0].number' --repo ${{ github.repository }})
          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" = "null" ]; then
            echo "no open issue found for run ${RUN_ID}; creating diagnosis comment on latest ops issue"
            ISSUE_NUM=$(gh issue list --label ops --state open --json number --jq '.[0].number' --repo ${{ github.repository }})
          fi
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            printf '\n---\n> 自动诊断由 AI Diagnose workflow 生成（run ${{ github.run_id }}）\n\n' >> ./diag/diagnosis.md
            gh issue comment "$ISSUE_NUM" --body-file ./diag/diagnosis.md --repo ${{ github.repository }}
            echo "diagnosis posted to issue #$ISSUE_NUM"
          else
            echo "no issue found; diagnosis content:"
            cat ./diag/diagnosis.md
          fi
