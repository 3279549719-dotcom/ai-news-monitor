name: Ops Check

# 每日运维巡检 — GitHub Actions 免费额度（开源仓库）足够跑
#   · 每日两次：08:00 UTC（北京 16:00）和 16:00 UTC（北京 00:00）
#   · 手动触发：Actions 页面 → Run workflow
#   · 超时 5 分钟，足够检查 + Supabase REST 调用

on:
  schedule:
    - cron: '0 8,16 * * *'   # 北京时间 16:00 和 00:00
  workflow_dispatch:          # 手动触发

jobs:
  ops-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ops check
        run: node scripts/ops-check.js --actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-check-result
          path: logs/.ops-check.json
          retention-days: 7

  # 告警：当 ops-check 失败时发 GitHub Issue
  alert-on-failure:
    needs: ops-check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-issue'
          title: '⚠️ Ops Check 巡检异常 — ${{ github.run_id }}'
          body: |
            ## Ops Check 失败

            运行时间: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            请检查 ops-check 详情日志，修复后关闭此 Issue。
          labels: 'ops, automated'
