name: Ops Check

on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ops-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pull latest logs
        run: |
          git pull origin master --rebase || echo "no new logs to pull"
      - name: Run ops check
        run: node scripts/ops-check.js --actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-check-result
          path: logs/.ops-check.json
          retention-days: 7

  alert-on-failure:
    needs: ops-check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create issue on failure
        run: |
          gh issue create \
            --title "⚠️ Ops Check 巡检异常 — ${{ github.run_id }}" \
            --body "## Ops Check 失败

运行时间: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

@copilot 请分析本次 ops-check 巡检失败的原因：
1. 读取 ops-check-result artifact 中的 logs/.ops-check.json
2. 定位所有失败项并分析根因
3. 给出可执行的修复建议
4. 在此 Issue 下评论你的诊断结论" \
            --label "ops,ai-diagnose"
        env:
          GH_TOKEN: ${{ github.token }}
