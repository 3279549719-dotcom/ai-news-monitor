name: Ops Check
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ops-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pull latest logs
        run: |
          git pull origin master --rebase || echo "no new logs to pull"
      - name: Run ops check
        run: node scripts/ops-check.js --actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: *** secrets.SUPABASE_SERVICE_KEY }}
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-check-result
          path: logs/.ops-check.json
          retention-days: 7

  alert-on-failure:
    needs: ops-check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create issue on failure
        run: |
          gh issue create \
            --title "Ops Check Failed — Run ${{ github.run_id }}" \
            --body "## Ops Check Failed%0A%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A%0A@copilot Please analyze the ops-check failure. Read the ops-check-result artifact, locate all failed checks, analyze root causes, and post your diagnosis as a comment." \
            --label "ops,ai-diagnose" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: *** github.token }}

