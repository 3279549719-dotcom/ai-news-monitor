name: Ops Check

# 每日运维巡检 — GitHub Actions 免费额度（开源仓库）足够跑
#   · 每日两次：08:00 UTC（北京 16:00）和 16:00 UTC（北京 00:00）
#   · 手动触发：Actions 页面 → Run workflow
#   · 超时 5 分钟，足够检查 + Supabase REST 调用
#   · Copilot AI 诊断：失败时 Issue body 含 @copilot 指令自动触发分析

on:
  schedule:
    - cron: '0 8,16 * * *'   # 北京时间 16:00 和 00:00
  workflow_dispatch:          # 手动触发

jobs:
  ops-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git pull to work

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull latest logs
        run: |
          git pull origin master --rebase || echo "no new logs to pull"

      - name: Run ops check
        run: node scripts/ops-check.js --actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-check-result
          path: logs/.ops-check.json
          retention-days: 7

  # 告警 + AI 诊断：当 ops-check 失败时创建 Issue 并触发 Copilot 分析
  # 注意：需要 GitHub Actions 有 issues:write 权限（Settings → Actions → General → Workflow permissions → Read and write）：当 ops-check 失败时创建 Issue 并触发 Copilot 分析
  alert-on-failure:
    needs: ops-check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-issue'
          title: '⚠️ Ops Check 巡检异常 — ${{ github.run_id }}'
          body: |
            ## Ops Check 失败

            运行时间: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            @copilot 请分析本次 ops-check 巡检失败的原因：
            1. 读取 ops-check-result artifact 中的 logs/.ops-check.json
            2. 定位所有失败项并分析根因
            3. 给出可执行的修复建议
            4. 在此 Issue 下评论你的诊断结论
          labels: 'ops, ai-diagnose'
